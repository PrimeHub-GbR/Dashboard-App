<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PrimeHub App Icon">
  <!-- Maskable Icon: 80% sicherer Bereich (Padding 51 px innen) -->
  <rect width="512" height="512" rx="112" fill="#0a1a10"/>
  <!-- Akzent-Ring (dezent) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1ad06a" stroke-width="10" opacity="0.18"/>
  <!-- Wordmark zentriert -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-weight="800">
    <text x="256" y="240" text-anchor="middle" font-size="78" fill="#ffffff" letter-spacing="-3">Prime</text>
    <text x="256" y="324" text-anchor="middle" font-size="78" fill="#1ad06a" letter-spacing="-3">Hub</text>
  </g>
</svg>
